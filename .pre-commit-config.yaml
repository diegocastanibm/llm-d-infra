# Generated output — excluded from every hook.
# Regenerate via gh-aw from .github/workflows/upstream-monitor.md instead of editing.
exclude: '^\.github/workflows/upstream-monitor\.lock\.yml$'

repos:
  # general pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # allows custom YAML tags used in k8s
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict

  # GitHub Actions workflow linting
  # check-yaml proves a workflow parses; actionlint proves it is a valid
  # workflow — bad ${{ }} expressions, unknown inputs, invalid uses/needs.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args:
          # Backlog excluded for now, to be tackled separately:
          #   -shellcheck= disables the shellcheck-inside-run-blocks
          #     integration (300 findings, nearly all info-level SC2086).
          #   -ignore skips one pre-existing required-input-with-default
          #     in reusable-query-success-past-runs.yaml.
          # All native actionlint checks stay on — those are the ones that
          # catch the #249 class of error.
          - -shellcheck=
          - -ignore
          - 'but it is also required'
